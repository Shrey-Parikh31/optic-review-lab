name: Review tooling
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lab-only
          POSTGRES_DB: optic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPTIC_TEST_DSN: postgresql://postgres:lab-only@localhost:5432/optic_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: bash scripts/tooling.sh
      - run: python -m unittest discover -s tests -p test_evidence.py -v
      - name: Import current GitHub review evidence into disposable PostgreSQL
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ env.OPTIC_TEST_DSN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python -m lab.sync "$GITHUB_REPOSITORY" "$PR_NUMBER"
      - name: Capture measured evaluation
        run: python -m lab.evaluate compare --output evaluation.json
      - uses: actions/upload-artifact@v4
        with:
          name: optical-review-evaluation
          path: evaluation.json

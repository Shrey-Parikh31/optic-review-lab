services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: optic
      POSTGRES_PASSWORD: lab-only
      POSTGRES_DB: optics
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optic -d optics"]
      interval: 3s
      timeout: 3s
      retries: 15
